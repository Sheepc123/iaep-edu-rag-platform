<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API调试工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 3px; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>API调试工具</h1>
        
        <div class="section">
            <h3>1. 检查后端连接</h3>
            <button onclick="checkBackend()">测试后端连接</button>
            <div id="backend-result" class="result"></div>
        </div>

        <div class="section">
            <h3>2. 用户登录</h3>
            <input type="text" id="username" placeholder="用户名" value="teacher123">
            <input type="password" id="password" placeholder="密码" value="123456">
            <button onclick="login()">登录</button>
            <div id="login-result" class="result"></div>
        </div>

        <div class="section">
            <h3>3. 检查认证状态</h3>
            <button onclick="checkAuth()">检查Token</button>
            <div id="auth-result" class="result"></div>
        </div>

        <div class="section">
            <h3>4. 测试练习创建</h3>
            <textarea id="exercise-data" rows="10" placeholder="练习数据JSON">
{
  "title": "测试练习",
  "description": "这是一个测试练习",
  "category": "自主练习",
  "subject": "数学",
  "difficulty": "medium",
  "time_limit": 60,
  "is_published": false
}
            </textarea>
            <button onclick="createExercise()">创建练习</button>
            <div id="exercise-result" class="result"></div>
        </div>

        <div class="section">
            <h3>5. 获取练习列表</h3>
            <button onclick="getExercises()">获取练习列表</button>
            <div id="exercises-result" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';

        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `result ${isError ? 'error' : 'success'}`;
        }

        async function checkBackend() {
            try {
                const response = await fetch('http://127.0.0.1:8000/health');
                const data = await response.json();
                log('backend-result', `后端连接正常:\n${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log('backend-result', `后端连接失败: ${error.message}`, true);
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });

                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    log('login-result', `登录成功:\n${JSON.stringify(data, null, 2)}`);
                } else {
                    log('login-result', `登录失败: ${data.detail || '未知错误'}`, true);
                }
            } catch (error) {
                log('login-result', `登录请求失败: ${error.message}`, true);
            }
        }

        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                log('auth-result', '没有找到访问令牌，请先登录', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/users/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('auth-result', `认证成功:\n${JSON.stringify(data, null, 2)}`);
                } else {
                    log('auth-result', `认证失败: ${data.detail || '未知错误'}`, true);
                }
            } catch (error) {
                log('auth-result', `认证请求失败: ${error.message}`, true);
            }
        }

        async function createExercise() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                log('exercise-result', '请先登录', true);
                return;
            }

            try {
                const exerciseData = JSON.parse(document.getElementById('exercise-data').value);
                
                const response = await fetch(`${API_BASE_URL}/exercises/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(exerciseData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('exercise-result', `练习创建成功:\n${JSON.stringify(data, null, 2)}`);
                } else {
                    log('exercise-result', `练习创建失败: ${data.detail || '未知错误'}`, true);
                }
            } catch (error) {
                log('exercise-result', `练习创建请求失败: ${error.message}`, true);
            }
        }

        async function getExercises() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                log('exercises-result', '请先登录', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/exercises/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('exercises-result', `练习列表获取成功:\n${JSON.stringify(data, null, 2)}`);
                } else {
                    log('exercises-result', `练习列表获取失败: ${data.detail || '未知错误'}`, true);
                }
            } catch (error) {
                log('exercises-result', `练习列表请求失败: ${error.message}`, true);
            }
        }

        // 页面加载时检查认证状态
        window.onload = function() {
            checkAuth();
        };
    </script>
</body>
</html>
